
name: Drug Classification MLOps

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # --------------------------------------------------
  # JOB 1: TRAIN AND EVALUATE
  # --------------------------------------------------

  train-evaluate:
    name: Train and Evaluate Three Models
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train all models
        run: |
          python scripts/train.py

      - name: Evaluate all models
        run: |
          python scripts/evaluate.py

      - name: Upload trained models and evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: drug-classification-models
          path: |
            artifacts/models/drug_rf.joblib
            artifacts/models/drug_dt.joblib
            artifacts/models/drug_lr.joblib
            artifacts/reports/metrics.json
            artifacts/reports/test_data.joblib
            artifacts/reports/sample_input.csv
            artifacts/reports/confusion_matrix_*.png
          if-no-files-found: error
          retention-days: 7


  # --------------------------------------------------
  # JOB 2: REGISTER MODELS IN SNOWFLAKE
  # --------------------------------------------------

  register-snowflake-models:
    name: Register Three Models in Snowflake
    needs: train-evaluate

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Download trained models and metrics
        uses: actions/download-artifact@v4
        with:
          name: drug-classification-models
          path: .

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-snowflake.txt

      - name: Register models in Snowflake
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_MODEL_SCHEMA: ${{ secrets.SNOWFLAKE_MODEL_SCHEMA }}
          SNOWFLAKE_RESULTS_SCHEMA: ${{ secrets.SNOWFLAKE_RESULTS_SCHEMA }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python scripts/register_model.py
